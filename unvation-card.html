<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真耶穌教會 上巴陵教會修繕感恩特別聚會 電子邀請函</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        church: {
                            navy: '#0F2C59',
                            gold: '#C5A059',
                            golddark: '#9A7328',
                            amber: '#D4AF37',
                            cream: '#FAF7F0'
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        sans: ['"Noto Sans TC"', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        .gold-border-glow {
            box-shadow: 0 0 30px rgba(197, 160, 89, 0.35);
        }
        .bg-church-pattern {
            background-color: #0f2c59;
            background-image: radial-gradient(rgba(212, 175, 55, 0.15) 1px, transparent 0);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen py-6 px-3 sm:px-4 flex flex-col justify-center items-center font-sans text-gray-800 selection:bg-amber-200">

    <!-- Page 1: Poster 1 Full Showcase -->
    <div class="poster-container relative max-w-2xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden border-4 border-church-gold/80 gold-border-glow transition-all mb-8">
        
        <!-- Poster 1 Image -->
        <div class="relative w-full overflow-hidden bg-slate-100 flex justify-center items-center">
            <img src="./%E7%B1%B3%E8%B7%AF%E8%A8%AD%E8%A8%88%E6%B5%B7%E5%A0%B11.jpg" alt="上巴陵教會修繕感恩特別聚會海報1" class="w-full h-auto object-contain block max-h-[90vh] sm:max-h-none shadow-md" onerror="handleImgFallback(this, '米路設計海報1.jpg')">
        </div>

        <!-- Floating Quick Action Overlay at Bottom of Poster 1 -->
        <div class="no-print bg-gradient-to-t from-slate-900/90 via-slate-900/60 to-transparent p-6 text-center text-white flex flex-col items-center gap-3">
            <div class="text-xs text-amber-300 font-bold flex items-center gap-1.5">
                <i class="fa-solid fa-sparkles text-amber-400"></i>
                誠摯邀請您蒞臨，共享在屬靈的喜樂與神家的榮耀！
            </div>
            <div class="flex flex-wrap justify-center gap-3 w-full max-w-md">
                <a href="#invite-page-2" class="w-full sm:w-auto bg-amber-500 hover:bg-amber-400 text-church-navy font-black px-6 py-3 rounded-xl text-sm shadow-xl flex items-center justify-center gap-2 transition transform hover:scale-105">
                    <i class="fa-solid fa-arrow-down"></i> 下滑查看地點地圖、聯絡資訊與 QR Code 報名
                </a>
            </div>
        </div>
    </div>

    <!-- Page 2: Poster 2 (2/3 height) + Integrated Information Panel (1/3 height) -->
    <div id="invite-page-2" class="invitation-card relative max-w-2xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden border-4 border-church-gold/80 gold-border-glow transition-all">
        
        <!-- Top 2/3: Poster 2 Visual Subject -->
        <div class="relative w-full overflow-hidden bg-slate-100 flex justify-center items-center border-b-2 border-church-gold/50">
            <img src="./%E7%B1%B3%E8%B7%AF%E8%A8%AD%E8%A8%88%E6%B5%B7%E5%A0%B12.jpg" alt="上巴陵教會修繕感恩特別聚會海報2" class="w-full h-auto object-contain block shadow-sm" onerror="handleImgFallback(this, '米路設計海報2.jpg')">
        </div>

        <!-- Bottom 1/3: Integrated Info Panel (Location, Contact, QR Code, Signature) -->
        <div class="bg-gradient-to-b from-amber-50/60 via-white to-amber-50/40 p-6 sm:p-8 space-y-6 text-church-navy">
            
            <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
                
                <!-- Left/Top Info Column -->
                <div class="md:col-span-7 space-y-4 text-left">
                    
                    <!-- Location & Address -->
                    <div class="space-y-1">
                        <div class="text-xs font-bold text-amber-800 uppercase tracking-wider flex items-center gap-1.5">
                            <i class="fa-solid fa-location-dot text-amber-600 text-sm"></i> 聚會地點 Location & Address
                        </div>
                        <div class="font-black font-serif text-church-navy text-base sm:text-lg">
                            真耶穌教會 上巴陵教會
                        </div>
                        <a href="https://maps.google.com/?cid=12259690429415433747" target="_blank" rel="noopener noreferrer" class="inline-flex items-start gap-1.5 text-xs text-amber-800 hover:text-amber-950 font-bold underline leading-snug group mt-0.5">
                            <i class="fa-solid fa-map-location-dot text-amber-600 group-hover:scale-110 transition-transform mt-0.5"></i>
                            <span>33644 桃園市復興區華陵里9鄰40號 <span class="text-[11px] text-amber-700">(點擊開啟Google地圖)</span></span>
                            <i class="fa-solid fa-arrow-up-right-from-square text-[10px] mt-0.5"></i>
                        </a>
                    </div>

                    <!-- Contact Person -->
                    <div class="pt-3 border-t border-amber-200/80 text-xs sm:text-sm font-bold text-church-navy flex items-center gap-2">
                        <div class="w-7 h-7 rounded-lg bg-amber-100 text-amber-800 flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-user-tie"></i>
                        </div>
                        <div>
                            <span class="text-gray-500 text-[11px] block font-normal">聯絡資訊 Contact</span>
                            <span>聯絡人：駐牧傳道 陳木群傳道</span>
                        </div>
                    </div>

                </div>

                <!-- Right/Bottom QR Code Column -->
                <div class="md:col-span-5 flex flex-col items-center justify-center text-center p-4 bg-white rounded-2xl shadow-md border border-amber-200 gap-2">
                    <div class="bg-white p-2 rounded-xl shadow border border-amber-300">
                        <div id="qrcode" class="w-24 h-24 sm:w-28 sm:h-28 flex items-center justify-center"></div>
                    </div>
                    <div class="space-y-0.5">
                        <div class="font-black font-serif text-church-navy text-xs sm:text-sm">
                            報名表單及電子紀念專刊 QR Code
                        </div>
                        <div class="text-[11px] text-amber-800 font-bold flex items-center justify-center gap-1">
                            <i class="fa-solid fa-qrcode"></i> 掃描 QR Code 線上報名
                        </div>
                        <div class="text-[10px] text-gray-500 font-bold">
                            統計愛餐與住宿人數
                        </div>
                    </div>
                    <a href="https://tjcdaxiinformation.github.io/baling-church-62th-anniversary/" target="_blank" class="text-[10px] text-amber-700 hover:underline font-mono block truncate max-w-[200px]">
                        tjcdaxiinformation.github.io/baling-church-62th-anniversary/
                    </a>
                </div>

            </div>

            <!-- Signature Line -->
            <div class="pt-4 border-t border-amber-300/60 text-center font-serif font-bold text-church-navy text-xs sm:text-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-cross text-amber-600 text-xs"></i>
                <span>真耶穌教會上巴陵教會職務會暨全體信徒 敬邀</span>
                <i class="fa-solid fa-cross text-amber-600 text-xs"></i>
            </div>

        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-msg" class="fixed bottom-6 bg-slate-900 text-amber-300 text-xs font-bold px-4 py-3 rounded-2xl shadow-2xl border border-amber-400/40 hidden transition-all duration-300 z-50 flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
        <span id="toast-text">網址已成功複製！</span>
    </div>

    <script>
        const rsvpUrl = "https://tjcdaxiinformation.github.io/baling-church-62th-anniversary/";

        window.onload = function() {
            // Generate QR Code
            const qrContainer = document.getElementById("qrcode");
            qrContainer.innerHTML = "";
            try {
                new QRCode(qrContainer, {
                    text: rsvpUrl,
                    width: 112,
                    height: 112,
                    colorDark : "#0F2C59",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            } catch(e) {
                // Fallback to QR server image if library fails
                qrContainer.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=112x112&data=${encodeURIComponent(rsvpUrl)}" alt="QR Code" class="w-28 h-28 object-contain">`;
            }
        };

        function copyInviteLink() {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(rsvpUrl).then(() => showToast("已複製報名連結！歡迎轉發各教會群組。"));
            } else {
                const dummy = document.createElement("input");
                document.body.appendChild(dummy);
                dummy.value = rsvpUrl;
                dummy.select();
                document.execCommand("copy");
                document.body.removeChild(dummy);
                showToast("已複製報名連結！歡迎轉發各教會群組。");
            }
        }

        function showToast(msg) {
            const toast = document.getElementById("toast-msg");
            document.getElementById("toast-text").innerText = msg;
            toast.classList.remove("hidden");
            setTimeout(() => toast.classList.add("hidden"), 3000);
        }

        function handleImgFallback(img, filename) {
            if (!img.dataset.retry) {
                img.dataset.retry = '1';
                img.src = './' + filename;
                return;
            }
            if (img.dataset.retry === '1') {
                img.dataset.retry = '2';
                img.src = './' + encodeURIComponent(filename);
                return;
            }
            img.onerror = null;
            img.src = 'https://placehold.co/800x1100/0f2c59/ffffff?text=' + encodeURIComponent(img.alt || '修繕感恩特別聚會');
        }
    </script>
</body>
</html>
